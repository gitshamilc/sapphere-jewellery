<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPPHERE Jewellery — Finest Premium Collections</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="logo-symbol">✨</span>
            <span class="logo-text">SAPPHERE</span>
        </div>
        <nav>
            <a href="#collections">Collections</a>
            <a href="admin/panel.html" class="nav-admin-link">Dashboard</a>
        </nav>
    </header>

    <main class="store-container">
        <section class="hero-section">
            <div class="hero-content">
                <h1>Crafted to Inspire</h1>
                <p>Explore handcrafted jewelry designed with modern aesthetics and timeless materials.</p>
            </div>
        </section>

        <section id="collections" class="collection-section">
            <div class="section-title">
                <h2>Bespoke Collection</h2>
                <div class="divider"></div>
            </div>
            <div id="products-grid" class="products-grid">
                <!-- Dynamically Rendered -->
                <div class="loading-state">Synchronizing Collections...</div>
            </div>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
