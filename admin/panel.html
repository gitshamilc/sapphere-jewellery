<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPPHERE — Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin_style.css">
    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="logo-symbol">✨</span>
            <span class="logo-text">SAPPHERE Control Panel</span>
        </div>
        <nav>
            <a href="../index.html">View Storefront</a>
        </nav>
    </header>

    <main class="admin-container">
        <section class="admin-header">
            <h2>Inventory Catalog Management</h2>
            <button class="add-btn" id="open-modal-btn">Add New Product</button>
        </section>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Product Info</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Badge</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-products-tbody">
                    <tr>
                        <td colspan="5" class="loading-state">Syncing Database...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add Product</h3>
                <button class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="p-name">Product Name *</label>
                    <input type="text" id="p-name" required placeholder="e.g. Diamond Pendant">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="p-cat">Category *</label>
                        <select id="p-cat" required>
                            <option value="necklace">Necklace</option>
                            <option value="earring">Earring</option>
                            <option value="bracelet">Bracelet</option>
                            <option value="ring">Ring</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="p-price">Price (INR) *</label>
                        <input type="number" id="p-price" required placeholder="e.g. 15000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="p-badge">Badge (Promo)</label>
                    <input type="text" id="p-badge" placeholder="e.g. New, Bestseller">
                </div>

                <div class="form-group">
                    <label for="p-img">Image URL</label>
                    <input type="text" id="p-img" placeholder="e.g. https://images.unsplash.com/... or upload image below">
                    <div class="upload-wrapper">
                        <label for="p-file" class="custom-file-upload">Upload Local Image</label>
                        <input type="file" id="p-file" accept="image/*">
                        <span id="file-status">No file chosen</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="p-desc">Description</label>
                    <textarea id="p-desc" placeholder="Product details, metrics, craftsmanship..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-btn" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="submit-btn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
