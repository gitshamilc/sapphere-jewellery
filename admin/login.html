<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPPHERE — Merchant Sign In</title>
  <link rel="stylesheet" href="admin.css">
  <script src="../config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-body">

  <!-- Background storefront blur effect -->
  <div class="login-bg-overlay"></div>

  <div class="login-container-wrap">
    <div class="login-box glass">
      <a href="../index.html" class="login-close" aria-label="Close Login"><i data-lucide="x"></i></a>
      <div class="login-header">
        <div class="logo">
          <i data-lucide="shield-check" style="color:var(--primary); width: 28px; height: 28px;"></i>
          SAPPHERE<span class="dot">.</span>
        </div>
        <h2>Merchant Sign In</h2>
        <p class="subtitle">Enter credentials to access the admin dashboard.</p>
      </div>

      <form id="login-form">
        <div class="login-field">
          <label for="userid">Username</label>
          <input type="text" id="userid" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error">Incorrect username or password.</div>
        
        <button type="submit" class="auth-btn">
          <i data-lucide="unlock" style="width:16px; height:16px;"></i>
          Authenticate
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from "../supabase/client.js";

    const localCreds = { id: "sapphere", pass: "sapphere@321" };
    
    // Check if Supabase client is active
    const isSupabaseConfigured = typeof window.CONFIG !== 'undefined' && 
                                 window.CONFIG.SUPABASE_URL && 
                                 window.CONFIG.SUPABASE_ANON_KEY && 
                                 supabase !== null && 
                                 location.protocol !== 'file:';

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      
      const usernameInput = document.getElementById('userid').value.trim();
      const pwd = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      const submitBtn = e.target.querySelector('.auth-btn');
      
      // Visual feedback: disable button and show authenticating state
      const originalBtnHTML = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-ring" style="width:14px; height:14px; display:inline-block; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle;"></span> Authenticating...';
      
      errorDiv.style.display = 'none';

      if (isSupabaseConfigured) {
        // Map simple username to structured email for Supabase Auth
        let email = usernameInput;
        if (!email.includes('@')) {
          email = email === 'sapphere' ? 'admin@sapphere.com' : `${email}@sapphere.com`;
        }

        try {
          // 1. Try to sign in
          let { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: pwd
          });

          // 2. Auto-provision admin user if they are logging in for the first time
          if (error && error.message.toLowerCase().includes("invalid login credentials")) {
            if (usernameInput === 'sapphere' && pwd === 'sapphere@321') {
              // Sign up default admin user
              const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                email: email,
                password: pwd
              });

              if (!signUpError) {
                // Retry sign in
                const retry = await supabase.auth.signInWithPassword({
                  email: email,
                  password: pwd
                });
                data = retry.data;
                error = retry.error;
              } else {
                console.error("Auto-provisioning failed:", signUpError.message);
              }
            }
          }

          if (!error && data?.user) {
            sessionStorage.setItem('adminAuth', 'true');
            location.href = 'panel.html';
          } else {
            // Fallback to local credentials if Supabase auth fails (e.g. email confirmation required, database offline/unhealthy, or user not created)
            if (usernameInput === localCreds.id && pwd === localCreds.pass) {
              console.warn("Supabase Auth failed, logging in via local fallback:", error ? error.message : "Unknown error");
              sessionStorage.setItem('adminAuth', 'true');
              location.href = 'panel.html';
            } else {
              console.error("Auth error:", error ? error.message : "Unknown error");
              errorDiv.textContent = error ? error.message : "Invalid login credentials.";
              errorDiv.style.display = 'block';
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalBtnHTML;
            }
          }
        } catch (err) {
          console.error(err);
          // Fallback to local credentials if network request throws exception
          if (usernameInput === localCreds.id && pwd === localCreds.pass) {
            console.warn("Supabase connection exception, logging in via local fallback:", err);
            sessionStorage.setItem('adminAuth', 'true');
            location.href = 'panel.html';
          } else {
            errorDiv.textContent = "Server connection error. Please try again.";
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnHTML;
          }
        }
      } else {
        // Local offline fallback mode
        if (usernameInput === localCreds.id && pwd === localCreds.pass) {
          sessionStorage.setItem('adminAuth', 'true');
          location.href = 'panel.html';
        } else {
          errorDiv.textContent = "Incorrect username or password.";
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnHTML;
        }
      }
    });
    
    // Add simple animation styles for spinner
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);

    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
